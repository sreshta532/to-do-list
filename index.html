<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-card">
        <header>
            <span class="tag">PERSONAL PLANNER</span>
            <h1>My Tasks<span>.</span></h1>
            <p>Plan it. Do it. Check it off.</p>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="task-input"
                placeholder="What needs to be done?"
                autocomplete="off"
            >
            <button id="add-task-btn" type="button">Add</button>
        </div>

        <ul id="task-list"></ul>

        <div id="empty-state" class="empty-state">
            <div class="empty-icon">✓</div>
            <p>Your task list is clear</p>
            <span>Add something you want to accomplish.</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
